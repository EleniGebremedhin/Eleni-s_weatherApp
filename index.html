<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Oswald:wght@200..700&family=PT+Mono&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>Eleni's_weatherApp</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            required
            class="search-form-input"
            id="search-form-input"
          />
          <input type="submit" value="search" class="search-form-button" />
        </form>
      </header>
      <main>
        <div class="weather-app-data">
          <div>
            <h1 class="weather-app-city" id="city">Paris</h1>
            <p class="weather-app-details">
              Tuesday 14:49, scattered clouds
              <br />
              Humidity: <strong>80%</strong>, Wind: <strong>3.6km/h</strong>
            </p>
          </div>
          <div class="weather-app-temprature-container">
            <div class="weather-app-icon">⛅</div>
            <div class="weather-app-temprature">12</div>
            <div class="weather-app-unit">°c</div>
          </div>
        </div>
      </main>

      <footer>
        This Projectis coded by
        <a href="https://github.com/EleniGebremedhin" target="_blank"
          >EleniGebremedhin</a
        >
        is
        <a
          href="https://github.com/EleniGebremedhin/Eleni-s_weatherApp.git"
          target="_blank"
        >
          open soursed on github
        </a>
        and
        <a href="https://eleni-weatherapp.netlify.app/" target="_blank">
          hosted on netlify</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
